name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release when you push a tag v*

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Read version
        run: |
          $v = python -c "import apex_search; print(apex_search.__version__)"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $v"

      - name: Tests (search engine)
        run: pytest -q

      - name: GUI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run.py --selftest

      - name: Build ApexSteelSearch.exe
        run: pyinstaller --noconfirm packaging/ApexSteelSearch.spec

      - name: Portable zip
        run: Compress-Archive -Path dist/ApexSteelSearch/* -DestinationPath "ApexSteelSearch-portable-$env:VERSION-win64.zip"

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ApexSteelSearch-${{ env.VERSION }}-windows
          path: |
            ApexSteelSearch-portable-*.zip
            Output/ApexSteelSearch-Setup-*.exe

      - name: Publish release (only for tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ApexSteelSearch-portable-*.zip
            Output/ApexSteelSearch-Setup-*.exe
