<style>
:root{--steel:#1F4E79;--steel2:#2C6AA0;--steelSoft:#E8F0F8;--amber:#F2A900;--amberSoft:#FFF4D6;--bg:#F4F6F9;--card:#fff;--line:#E1E6ED;--text:#1B2430;--muted:#5F6D7E;--green:#1E8E5A;--greenSoft:#E3F4EC;--red:#C0392B;--redSoft:#FBE7E4}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.45}
button,input,select{font-family:inherit;font-size:inherit}
.app{display:grid;grid-template-columns:224px 1fr;grid-template-rows:60px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--steel);color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;opacity:.75}
.gsearch{flex:1;max-width:640px;position:relative}
.gsearch input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;border:0;outline:none;background:#fff;color:var(--text)}
.gsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.mode{display:flex;background:rgba(255,255,255,.14);border-radius:10px;padding:3px;gap:2px}
.mode button{border:0;background:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.mode button.on{background:#fff;color:var(--steel)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.hstat{font-size:12px;opacity:.85;white-space:nowrap}
nav{background:#fff;border-right:1px solid var(--line);padding:14px 10px;overflow:auto}
nav .grp{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:500;cursor:pointer}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--steelSoft);color:var(--steel);font-weight:600}
nav a .tag{margin-left:auto;font-size:10.5px;background:var(--amberSoft);color:#8A6100;padding:1px 6px;border-radius:6px;font-weight:600}
main{overflow:auto;padding:22px 26px 60px}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px;color:var(--text)}
.chip:hover{border-color:var(--steel2)}
.chip.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.chip.ex{background:var(--amberSoft);border-color:#F3D98A}
.bigsearch{display:flex;gap:8px;margin-bottom:12px}
.bigsearch input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff}
.bigsearch input:focus{border-color:var(--steel2);box-shadow:0 0 0 3px var(--steelSoft)}
.btn{border:0;background:var(--steel);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--steel2)}
.btn.ghost{background:#fff;color:var(--steel);border:1px solid var(--line)}
.btn.amber{background:var(--amber);color:#2B2000}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
select{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.res{display:flex;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.12s}
.res:hover{border-color:var(--steel2);box-shadow:0 2px 10px rgba(31,78,121,.08)}
.res .thumb{width:86px;height:62px;flex:none;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#fafbfc}
.res .thumb svg{width:100%;height:100%;display:block}
.res .body{flex:1;min-width:0}
.res .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res .p{color:var(--muted);font-size:12px;margin:2px 0 5px;font-family:'JetBrains Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .s{font-size:13px;color:#33414F}
.score{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted);flex:none}
.score b{display:block;font-size:17px;color:var(--steel)}
mark{background:#FFE48A;color:inherit;padding:0 1px;border-radius:3px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
.b-pdf{background:#FDE6E3;color:#B23121}.b-docx{background:#E2ECFB;color:#1F57B8}.b-xlsx{background:#E1F4E8;color:#1A7A45}
.b-dwg,.b-dxf{background:#EDE6FA;color:#5B35A8}.b-jpg{background:#FFF0D9;color:#9A5B00}.b-msg{background:#E6F4F6;color:#156B78}
.b-latest{background:var(--greenSoft);color:var(--green)}.b-old{background:#EEF0F3;color:var(--muted)}
.b-ocr{background:var(--amberSoft);color:#8A6100}.b-lang{background:#EEF0F3;color:#44505E}
.why{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.why span{font-size:11px;background:var(--steelSoft);color:var(--steel);padding:2px 8px;border-radius:6px}
.empty{color:var(--muted);text-align:center;padding:40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.stat b{display:block;font-size:22px;color:var(--steel)}
.stat span{color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);cursor:pointer;user-select:none;background:#FAFBFC;position:sticky;top:0}
tr.click{cursor:pointer}tr.click:hover td{background:#F7FAFD}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
/* drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(520px,100vw);background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(20,40,70,.12);transform:translateX(105%);transition:.22s;z-index:30;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dh h2{font-size:16px;margin:0 0 4px;word-break:break-word}
.x{margin-left:auto;border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;flex:none}
.db{padding:16px 18px;overflow:auto;flex:1}
.visual{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px;background:#fafbfc}
.visual svg{display:block;width:100%;height:auto}
.meta{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13px;margin-bottom:14px}
.meta div:nth-child(odd){color:var(--muted)}
.txt{background:#FAFBFC;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 160px);min-height:420px}
.msgs{flex:1;overflow:auto;padding:6px 2px 10px;display:flex;flex-direction:column;gap:12px}
.m{max-width:82%;padding:11px 14px;border-radius:14px;font-size:13.5px}
.m.u{align-self:flex-end;background:var(--steel);color:#fff;border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.m.a .who{font-size:11px;color:var(--muted);margin-bottom:5px;display:flex;gap:6px;align-items:center}
.m.a ul{margin:6px 0;padding-left:18px}
.m.a table{margin:8px 0;font-size:12px}
.m.a th,.m.a td{padding:5px 7px;font-size:12px}
.cite{display:inline-block;background:var(--steelSoft);color:var(--steel);font-weight:700;font-size:11px;border-radius:5px;padding:0 5px;margin:0 1px;cursor:pointer}
.srcs{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;font-size:12px;color:var(--muted)}
.srcs div{cursor:pointer}.srcs div:hover{color:var(--steel)}
.composer{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.composer input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:10px;outline:none}
.typing span{display:inline-block;width:6px;height:6px;margin:0 2px;background:var(--muted);border-radius:50%;animation:b 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
/* photos */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ph{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.ph svg,.ph img{display:block;width:100%;height:130px;object-fit:cover}
.ph .c{padding:8px 10px;font-size:12px}
.ph .sim{position:absolute;top:8px;right:8px;background:var(--steel);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.ph.sel{outline:3px solid var(--amber)}
.drop{border:2px dashed #C9D3DF;border-radius:12px;padding:18px;text-align:center;color:var(--muted);background:#fff;cursor:pointer}
.drop.over{border-color:var(--steel2);background:var(--steelSoft)}
/* diff */
.diff div{padding:5px 9px;border-radius:6px;margin:3px 0;font-size:13px}
.add{background:var(--greenSoft);color:#14603D}.del{background:var(--redSoft);color:#8E2A1F;text-decoration:line-through}.same{color:var(--muted)}
.tl{display:flex;gap:0;align-items:center;margin:10px 0 4px;flex-wrap:wrap}
.tl .r{padding:6px 12px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer;font-size:12.5px}
.tl .r:first-child{border-radius:8px 0 0 8px}.tl .r:last-child{border-radius:0 8px 8px 0}
.tl .r.lt{background:var(--greenSoft);color:var(--green);border-color:#BFE3CF}
.tl .r.selA{box-shadow:inset 0 -3px 0 var(--red)}.tl .r.selB{box-shadow:inset 0 -3px 0 var(--green)}
.bar{height:8px;background:#E7ECF2;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--steel2),var(--amber));width:0;transition:width .2s}
.log{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);height:120px;overflow:auto;background:#FAFBFC;border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}
.set{display:grid;grid-template-columns:220px 1fr;gap:12px 18px;align-items:center}
.set label{color:var(--muted)}
.switch{position:relative;width:42px;height:24px;background:#CBD3DD;border-radius:999px;cursor:pointer;border:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.15s}
.switch.on{background:var(--green)}.switch.on::after{left:21px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1B2430;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:50;font-size:13px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.banner{background:var(--amberSoft);border:1px solid #F3D98A;color:#6B4C00;border-radius:10px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
@media (max-width:860px){
 .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
 header{flex-wrap:wrap;padding:10px 12px;gap:10px}
 .gsearch{order:3;flex-basis:100%;max-width:none}
 .hstat{display:none}
 nav{display:flex;overflow-x:auto;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
 nav .grp{display:none}nav a{white-space:nowrap}nav a .tag{display:none}
 main{padding:16px}
 .grid2,.grid3{grid-template-columns:1fr}
 .set{grid-template-columns:1fr}
}
</style>

}

function applyFilters(rs){
 return rs.filter(({d})=>{if(d.dupOf)return S.view==='search'?true:false;
  if(S.type!=='all'){const m={drawing:['dwg','dxf'],pdf:['pdf'],docx:['docx'],xlsx:['xlsx'],photo:['jpg'],msg:['msg']};if(S.type==='drawing'?d.kind!=='drawing':!m[S.type].includes(d.ext))return false}
  if(S.project!=='all'&&d.project!==S.project)return false;if(S.latest&&!isLatest(d))return false;return true})
  .sort((a,b)=>S.sort==='date'?b.d.date.localeCompare(a.d.date):0);
}
function resRow(r,mode){
 const d=r.d;const terms=r.terms;const sn=snippet(d.text,terms);
 const rv=d.dno?(isLatest(d)?`<span class="badge b-latest">✓ Latest Rev ${d.rev}</span>`:`<span class="badge b-old">Superseded Rev ${d.rev}</span>`):'';
 const why=mode==='smart'&&r.ov.length?`<div class="why">${r.ov.map(c=>`<span>≈ ${esc(C[c].l)}</span>`).join('')}${d.lang!=='EN'&&d.lang!=='—'?`<span>🌐 cross-language (${esc(d.lang)})</span>`:''}</div>`:'';
 const sc=mode==='smart'?`<div class="score"><b>${r.p}%</b>meaning</div>`:`<div class="score"><b>${r.hit}/${toks(S.q).length}</b>words</div>`;
 return `<div class="res" data-open="${d.id}"><div class="thumb">${visual(d)}</div><div class="body"><div class="t">${badge(d)} ${hl(d.name,terms)} ${rv} ${d.ocr?'<span class="badge b-ocr">OCR</span>':''} ${d.dupOf?'<span class="badge b-old">duplicate</span>':''}</div><div class="p">${esc(d.path)} · ${d.date} · ${d.size}</div><div class="s">${hl(sn,terms)}</div>${why}</div>${sc}</div>`;
}

function msgHTML(m){if(m.r==='u')return `<div class="m u">${esc(m.t)}</div>`;if(m.typing)return `<div class="m a"><div class="who">🤖 Apex AI</div><div class="typing"><span></span><span></span><span></span></div></div>`;

const cite=(src,id)=>`<span class="cite" data-open="${id}">${src.indexOf(id)+1}</span>`;
function answer(q){
 const l=q.toLowerCase();let src,h;
 if(/(bolt|螺栓|boulon|torque|扭矩)/.test(l)&&/(crane|girder|吊车|pont)/.test(l)){src=[3,4,18,22];h=`For the crane girder connections:<ul><li><b>Bolts M24 HV, grade 10.9</b>, preloaded ${cite(src,3)} ${cite(src,4)}</li><li><b>Tightening torque 1100 Nm</b>, torque method, with hardened washers on both sides ${cite(src,4)}</li><li>10% of bolts checked by the inspector ${cite(src,4)} — the Chinese briefing says the same (终拧扭矩 1100 N·m, 抽检10%) ${cite(src,18)}</li><li>Torque wrench TW-07 is calibrated (+1.8% at 1100 Nm), valid until 2027-03-15 ${cite(src,22)}</li></ul>`}
 else if(/(summar|résum|总结|method statement)/.test(l)){src=[5,23];h=`<b>Method statement MS-2401-007 — erection of crane girders</b> ${cite(src,5)}<ul><li><b>Scope:</b> runway girders axis 1 to 6</li><li><b>Equipment:</b> 220 t crawler crane, 2 × 25 t chain blocks, 26 m man-lift</li><li><b>Sequence:</b> check bracket levels → lift with spreader beam → bolts snug-tight → survey alignment → preload to 1100 Nm</li><li><b>Permits:</b> lifting + working at height, daily</li><li><b>Safety:</b> exclusion zone 1.5 × boom, harness above 2 m, stop above 9.8 m/s wind</li><li><b>Inspection:</b> 10% torque check, survey before rail</li></ul>Heaviest lift is 20 t at 22 m radius, crane utilisation 65% ${cite(src,23)}.`}
 else if(/(rev|change|differ|compare|modif)/.test(l)){src=[2,1];h=`Comparing <b>D-2401-S-101</b> Rev B ${cite(src,2)} with Rev C ${cite(src,1)}:<ul><li style="color:#14603D">＋ Base plate thickness <b>35 mm → 40 mm</b></li><li style="color:#14603D">＋ <b>Shear key HEA 160</b> added on columns A3 and A4</li><li>No change to anchor bolts (M36 8.8, 900 mm), grout or tolerances</li></ul>⚠️ A copy of Rev C is also in your Downloads folder, and Rev B is superseded — don't use it on site.`}
 else if(/(extract|excel|list|bom|table|tableau)/.test(l)){src=[7];const rows=[['M36 x 1200 anchor bolt','8.8 HDG','96','Columns A–F'],['M24 x 90 HV bolt','10.9','384','Crane girders'],['M20 x 70 bolt','8.8','520','Roof bracing'],['Hardened washer M24','—','768','Crane girders'],['Non-shrink grout 25 kg','—','140 bags','Column bases']];S.lastCSV='Item;Grade;Qty;Location\n'+rows.map(r=>r.join(';')).join('\n');
  h=`Here is the bolt & anchor list from the BOM ${cite(src,7)}:<table><tr><th>Item</th><th>Grade</th><th>Qty</th><th>Location</th></tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table><div class="row"><button class="btn sm amber" data-copycsv>📋 Copy for Excel</button><button class="btn ghost sm" data-savex>💾 Save as .xlsx</button></div>`}
 else if(/(grout|calage|灌浆|curing|loading)/.test(l)){src=[20,1,18];h=`Grout under the column bases must reach <b>30 MPa before loading</b> with crane girders — about <b>3 days at 20 °C</b>, 5 days below 10 °C. Send cube test results before erection ${cite(src,20)}.<br><br>The grout itself: 50 mm non-shrink, min 60 MPa final strength; remove levelling nuts after grouting ${cite(src,1)}. The Chinese briefing gives the same 30 MPa rule ${cite(src,18)}.`}
 else if(/(ncr|non.?conform|problem|deviation|misalign|issue)/.test(l)){src=[12,13];h=`Yes — <b>NCR-2401-012</b> (scanned, read by OCR) ${cite(src,12)}:<ul><li>Anchor bolt at <b>column C2</b> was <b>12 mm out</b> (tolerance ±3 mm)</li><li>Cause: template moved during concrete pouring</li><li>Fix: bolt cut, resin anchor M36 installed, approved by designer</li><li>Status: <b>closed 14 Nov 2026</b></li></ul>Also open in the daily report of 12 Nov: 2 bolts M24 missing at girder G3-2 ${cite(src,13)}.`}
 else if(/(paint|coat|dft|peinture|防腐)/.test(l)){src=[14];h=`Coating system ${cite(src,14)}: Sa 2.5 blasting → zinc-rich epoxy primer 60 µm → epoxy MIO 120 µm → polyurethane topcoat 60 µm. <b>Total DFT ≥ 240 µm.</b> Galvanized parts get a duplex system; touch up bolts after erection.`}
 else{const rs=smartSearch(q).slice(0,3);if(!rs.length){src=[];h=`I couldn't find anything about that in your indexed files. Try other words, or add the folder that contains it in <b>Folders &amp; index</b>.`}else{src=rs.map(r=>r.d.id);h=`Here is what I found most related:<ul>${rs.map(r=>`<li><b>${esc(r.d.title)}</b> ${cite(src,r.d.id)} — ${esc(snippet(r.d.text,r.terms,90))}</li>`).join('')}</ul>${S.online?'':'<i style="color:var(--muted);font-size:12px">Tip: switch to Online for a more detailed answer from the cloud model.</i>'}`}}
 return{h,src};
}
function ask(q){if(!q.trim())return;S.chat.push({r:'u',t:q});S.chat.push({r:'a',typing:true});render();const delay=S.online?700:1300;
 setTimeout(()=>{const a=answer(q);S.chat.pop();S.chat.push({r:'a',h:a.h,src:a.src,model:S.online?S.cloud:S.model});render()},delay)}

/* ============ DRAWER ============ */
function openDoc(id){const d=byId(id);if(!d)return;const terms=S.view==='smart'?smartSearch(S.sq).find(r=>r.d.id===d.id)?.terms||[]:toks(S.q);
 const rvs=d.dno?D.filter(o=>o.dno===d.dno&&!o.dupOf).sort((a,b)=>a.rev.localeCompare(b.rev)):[];
 $('#dh').innerHTML=`<div style="min-width:0"><h2>${esc(d.title)}</h2><div class="row" style="gap:6px">${badge(d)}${d.dno?`<span class="badge ${isLatest(d)?'b-latest':'b-old'}">${isLatest(d)?'✓ Latest':'Superseded'} Rev ${d.rev}</span>`:''}${d.ocr?'<span class="badge b-ocr">OCR</span>':''}<span class="badge b-lang">${esc(d.lang)}</span></div></div><button class="x" id="dx">×</button>`;
 $('#db').innerHTML=`<div class="visual">${visual(d)}</div><div class="meta"><div>File</div><div class="mono" style="word-break:break-all">${esc(d.name)}</div><div>Folder</div><div class="mono" style="word-break:break-all">${esc(d.path)}</div><div>Project</div><div>${esc(PROJ[d.project])}</div><div>Date · size</div><div>${d.date} · ${d.size}</div>${d.dno?`<div>Drawing no.</div><div class="mono">${d.dno}</div><div>Revisions</div><div class="row" style="gap:4px">${rvs.map(o=>`<span class="badge ${isLatest(o)?'b-latest':'b-old'}" style="cursor:pointer" data-open="${o.id}">${o.rev}</span>`).join('')}</div>`:''}${d.material?`<div>Material</div><div>${d.material}</div>`:''}${d.labels?`<div>Detected</div><div>${d.labels.join(', ')}</div>`:''}</div>
 <b style="font-size:12.5px">Extracted text</b><div class="txt" style="margin-top:6px">${hl(d.text,terms)}</div>`;
 $('#df').innerHTML=`<button class="btn sm" data-act="Opening file in default app…">Open file</button><button class="btn ghost sm" data-act="Opening folder in Explorer…">Open folder</button><button class="btn ghost sm" data-act="Added to today's Apex Steel daily report">＋ Daily report</button><button class="btn ghost sm" data-askabout="${d.id}">💬 Ask AI about it</button>`;
 $('#drawer').classList.add('open')}
const closeDrawer=()=>$('#drawer').classList.remove('open');

/* ============ RENDER & EVENTS ============ */
function render(){
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===S.view));
 document.querySelectorAll('#modeSw button').forEach(b=>b.classList.toggle('on',(b.dataset.m==='on')===S.online));
 $('#hstat').innerHTML=`${D.length} files · ${S.online?'☁️ Online':'🔒 Offline'}${S.sync?(S.online?' · 📱 synced':' · 📱 sync paused'):''}`;
 $('#main').innerHTML=(S.online?'':'')+V[S.view]();
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
 if(S.view==='assistant'){const ci=$('#cin');ci&&ci.focus()}
}
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){location.hash=v}render();$('#main').scrollTop=0}
function setMode(on){S.online=on;render();toast(on?'Online: cloud AI and phone sync enabled':'Offline: everything runs on your laptop')}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-v],[data-open],[data-type],[data-ex],[data-sex],[data-ask],[data-sort],[data-dno],[data-rv],[data-ph],[data-del],[data-sw],[data-m],[data-setm],[data-act],[data-askabout],[data-copycsv],[data-savex],[data-go-smart],#go,#sgo,#dx,#clr,#reidx,#addf,#clrsel,#clrdrop,#ssync');
 if(!t)return;const ds=t.dataset;
 if(ds.v){e.preventDefault();go(ds.v)}
 else if(ds.goSmart!==undefined){e.preventDefault();S.sq=S.q;go('smart')}
 else if(ds.open){openDoc(+ds.open)}
 else if(ds.type){S.type=ds.type;render()}
 else if(ds.ex){S.q=ds.ex;$('#gq').value=S.q;render()}
 else if(ds.sex){S.sq=ds.sex;$('#gq').value=S.sq;render()}
 else if(ds.ask){ask(ds.ask)}
 else if(ds.sort){S.libDir=S.libSort===ds.sort?-S.libDir:1;S.libSort=ds.sort;render()}
 else if(ds.dno){S.revDno=ds.dno;S.revA=S.revB=null;render()}
 else if(ds.rv){const id=+ds.rv;const a=byId(S.revA),c=byId(id);if(c.rev<byId(S.revB).rev||id===S.revB)S.revA=id;else S.revB=id;render()}
 else if(ds.ph){S.photoSel=+ds.ph;S.dropImg=null;render();$('#main').scrollTop=0}
 else if(ds.del){toast('Moved to _to_delete folder (simulation)');t.outerHTML='<span class="badge b-old">moved</span>'}
 else if(ds.sw!==undefined){t.classList.toggle('on');toast(t.classList.contains('on')?'Folder will be watched':'Folder excluded from index')}
 else if(ds.m){setMode(ds.m==='on')}
 else if(ds.setm){setMode(ds.setm==='on')}
 else if(ds.act){toast(ds.act+' (simulation)')}
 else if(ds.askabout){const d=byId(+ds.askabout);closeDrawer();S.view='assistant';render();ask(d.title.toLowerCase().includes('method')?'Summarise the crane girder method statement':('What is important in '+d.title+'?'))}
 else if(ds.copycsv!==undefined){navigator.clipboard.writeText(S.lastCSV||'').then(()=>toast('Copied — paste into Excel'),()=>toast('Copy blocked by the browser here — works in the real app'))}
 else if(ds.savex!==undefined){toast('Saved BOM_bolts.xlsx to D:\\Projects\\P-2401\\Material (simulation)')}
 else if(t.id==='go'){S.q=$('#q').value;$('#gq').value=S.q;render()}
 else if(t.id==='sgo'){S.sq=$('#sq').value;$('#gq').value=S.sq;render()}
 else if(t.id==='dx'){closeDrawer()}
 else if(t.id==='clr'){S.chat=[];render()}
 else if(t.id==='clrsel'){S.photoSel=null;render()}
 else if(t.id==='clrdrop'){S.dropImg=null;render()}
 else if(t.id==='ssync'){S.sync=!S.sync;render()}
 else if(t.id==='addf'){toast('Folder picker opens in the real app (simulation)')}
 else if(t.id==='reidx'){reindex()}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeDrawer();
 if(e.key==='Enter'){if(e.target.id==='q'){S.q=e.target.value;$('#gq').value=S.q;render()}else if(e.target.id==='sq'){S.sq=e.target.value;$('#gq').value=S.sq;render()}}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='fproj'){S.project=t.value;render()}else if(t.id==='flatest'){S.latest=t.checked;render()}else if(t.id==='fsort'){S.sort=t.value;render()}
 else if(t.id==='smodel'){S.model=t.value;toast('Local model: '+t.value)}else if(t.id==='scloud'){S.cloud=t.value;toast('Cloud model: '+t.value)}
 else if(t.dataset.ocr){S.ocr[t.dataset.ocr]=t.checked}
 else if(t.id==='fimg'&&t.files[0]){loadImg(t.files[0])}
});
document.addEventListener('submit',e=>{if(e.target.id==='cform'){e.preventDefault();const i=$('#cin');const v=i.value;i.value='';ask(v)}});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))loadImg(f)}});
function loadImg(f){S.dropImg=URL.createObjectURL(f);S.photoSel=null;render()}
let gt;$('#gq').addEventListener('input',e=>{clearTimeout(gt);gt=setTimeout(()=>{const v=e.target.value;if(S.view==='smart'){S.sq=v}else{S.q=v;if(S.view!=='search')S.view='search'}render();},250)});
$('#gq').addEventListener('keydown',e=>{if(e.key==='Enter'){clearTimeout(gt);const v=e.target.value;if(S.view==='assistant'){ask(v);e.target.value='';return}if(S.view==='smart')S.sq=v;else{S.q=v;S.view='search'}render()}});

function reindex(){if(S.indexing)return;S.indexing=true;const log=$('#plog'),bar=$('#pbar'),txt=$('#ptxt');log.textContent='';let i=0;
 const steps=D.map(d=>`${d.kind==='photo'||d.kind==='scan'?'OCR   ':d.ext==='dwg'?'DWG→DXF':d.kind==='drawing'?'TITLE ':'TEXT  '} ${d.name}`).concat(['EMBED  bge-m3 vectors for 24 files','DONE   index optimised (182 MB)']);
 const iv=setInterval(()=>{if(!$('#plog')){clearInterval(iv);S.indexing=false;return}log.textContent+=steps[i]+'\n';log.scrollTop=log.scrollHeight;i++;const p=Math.round(i/steps.length*100);$('#pbar').style.width=p+'%';$('#ptxt').textContent=`Indexing… ${p}%`;
  if(i>=steps.length){clearInterval(iv);S.indexing=false;$('#ptxt').textContent='Index up to date · 182 MB · just now';toast('Index updated')}},140)}

const views=Object.keys(V);
function fromHash(){const h=location.hash.slice(1);if(views.includes(h)){S.view=h;render()}}
window.addEventListener('hashchange',fromHash);
S.q='anchor bolt';
if(views.includes(location.hash.slice(1)))S.view=location.hash.slice(1);
render();
</script>
</body>
</html>
